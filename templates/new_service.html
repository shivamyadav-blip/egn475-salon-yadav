{% extends "base.html" %}

{% block title %}Add Service | Nexa Salon{% endblock %}

{% block content %}
  <h1>Add Service</h1>
  {% if error %}
    <p role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('new_service') }}">
    <label for="name">Service name</label>
    <input id="name" name="name" value="{{ form.get('name', '') }}" required>

    <label for="category">Category (optional)</label>
    <input id="category" name="category" value="{{ form.get('category', '') }}">

    <label for="duration">Duration in minutes</label>
    <input id="duration" name="duration_minutes" type="number" min="1"
           value="{{ form.get('duration_minutes', '') }}" required>

    <label for="price">Price in dollars</label>
    <input id="price" name="price" type="number" min="0" step="0.01"
           value="{{ form.get('price', '') }}" required>

    <button type="submit">Save Service</button>
  </form>
  <p><a href="{{ url_for('services') }}">Back to Services</a></p>
{% endblock %}
